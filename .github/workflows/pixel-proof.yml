name: Pixel proof

# For a pull request labelled no-visual-change: screenshots the game in every finish
# on the base branch and on the pull request, on one runner, and fails if any pixel differs.
on:
  pull_request:
    types: [labeled, opened, synchronize]

permissions:
  contents: read

jobs:
  compare:
    if: contains(github.event.pull_request.labels.*.name, 'no-visual-change')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture the base branch
        run: |
          git checkout -q "${{ github.event.pull_request.base.sha }}"
          pnpm install --frozen-lockfile
          pnpm --filter thousand-paws exec vite --port 5183 --strictPort &
          server=$!
          npx --yes wait-on@8.0.3 http://localhost:5183
          node scripts/capture.mjs "$RUNNER_TEMP/before"
          kill "$server"
      - name: Capture the pull request
        run: |
          git checkout -q "${{ github.event.pull_request.head.sha }}"
          pnpm install --frozen-lockfile
          pnpm --filter thousand-paws exec vite --port 5183 --strictPort &
          server=$!
          npx --yes wait-on@8.0.3 http://localhost:5183
          node scripts/capture.mjs "$RUNNER_TEMP/after"
          kill "$server"
      - name: Compare
        run: node scripts/compare.mjs "$RUNNER_TEMP/before" "$RUNNER_TEMP/after"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: |
            ${{ runner.temp }}/before
            ${{ runner.temp }}/after
